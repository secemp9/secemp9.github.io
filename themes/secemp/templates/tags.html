{% extends "base.html" %}

{% block body_class %} class="post-page"{% endblock %}

{% block title %}Tags - {{ SITENAME }}{% endblock %}

{% block content %}
<div class="listing-shell">
  <div class="page-header">
    <div class="page-meta">
      <div class="page-kicker">Explore</div>
    </div>
    <h1 class="page-title">Tags</h1>
  </div>

  <div class="tags-cloud">
    {% for tag, articles in tags|sort %}
      <a href="{{ SITEURL }}/{{ tag.url }}" class="tag-link">
        <span>{{ tag }}</span>
        <span class="tag-count">{{ articles|count }}</span>
      </a>
    {% endfor %}
  </div>
</div>
{% endblock %}
