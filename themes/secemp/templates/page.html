{% extends "base.html" %}

{% block title %}{{ page.title }} - {{ SITENAME }}{% endblock %}

{% block body_class %} class="post-page"{% endblock %}

{% block content %}
<div class="content-shell">
  <div class="back-link">
    <a href="{{ SITEURL }}/" aria-label="Back to Home">&larr; Back</a>
  </div>
  <div class="page-header">
    <div class="page-meta">
      <div class="page-kicker">cat {{ page.slug }}.md</div>
    </div>
    <h1 class="page-title">{{ page.title }}</h1>
  </div>
  <div class="page-content">
    {{ page.content }}
  </div>
</div>
{% endblock %}
